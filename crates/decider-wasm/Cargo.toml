[package]
name = "decider-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { workspace = true, default-features = false, features = ["ndarray", "autodiff", "store"] }
burn-store = { workspace = true, features = ["burnpack"] }
decider-model = { path = "../decider-model" }
serde = { workspace = true, features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]
