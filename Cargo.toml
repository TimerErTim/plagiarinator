[workspace]
members = [
    "scripts/data_loading",
    "scripts/graph_deeplearning",
    "scripts/annembed_export",
    "crates/*",
]
resolver = "2"


[workspace.dependencies]
serde = "1.0.228"
serde_json = "1.0.145"
tempfile = "3.23.0"
itertools = "0.14.0"
fastrand = "2.3.0"
rustc-hash = "2.1.2"
rand = "0.10.1"
thiserror = "2.0.10"
# Autodiff for CPU; `graph_deeplearning` enables `burn/cuda` when built with `--features cuda`.
burn  = { version =  "0.21.0", features = ["flex", "ndarray", "openblas", "autodiff", "autotune", "fusion"], default-features = false}
burn-store = { version = "0.21.0", features = [] }

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
